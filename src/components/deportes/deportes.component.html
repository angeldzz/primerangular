<div>
    <h1>Deportes Angular</h1>
    <ul>
        <!-- Tipos de Formas de hacer ifs -->
        <!-- [style.color]="num % 2 === 0 ? 'red' : 'green'" -->
        

        <!-- [ngClass]="{
            rojo: num % 2 === 0,
            verde:num % 2 !== 0,
        }" -->


        <!-- [class.rojo]="num % 2 === 0"
        [class.verde]="num % 2 !== 0" -->
        <li *ngFor="let num of numeros">
            {{num  * 2 }}
        </li>
    </ul>
    <h2>Numero de deportes {{ sports.length }}</h2>
    <div *ngIf="sports.length < 5; then condicionTrue; else condicionelse">
    </div>
    <ng-template #condicionTrue>
        <p style="color: red;">Tienes menos de 5 deportes</p>
    </ng-template>
    <ng-template #condicionelse>
        <p style="color: green;">Tienes mas de 5 deportes</p>
    </ng-template>
    <p>El primer deporte es {{ sports[0] }}</p>
    <ul>
        <li *ngFor="let deporte of sports; let i = index">
            Index: {{ i }}, Deporte:{{ deporte }}
        </li>
    </ul>
</div>
